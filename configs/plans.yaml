# Obuna rejalari — narx va chegaralar
#
# Bu fayl **biznes qarori**, kod emas. Uni oʻzgartirish uchun reliz
# chiqarish shart emas:
#
#   uzlegal plans show                     # joriy holat
#   POST /v1/admin/plans/reload            # xizmatni toʻxtatmasdan qayta oʻqish
#
# Maydonlar: src/uzlegal/users/plans.py → Plan


# --------------------------------------------------------------------- #
# Toʻlov holati
# --------------------------------------------------------------------- #
#
# `enabled: false` — BEPUL DAVR. Chegaralar umuman qoʻllanmaydi va
# barcha imkoniyatlar ochiq. Rejalar tuzilmasi saqlanadi, yaʼni
# toʻlovni yoqish uchun shu bitta qiymatni `true` qilish yetarli.
#
# Ishga tushirish rejasi:
#   1-bosqich  enabled: false  — foydalanuvchi jalb qilinadi
#   2-bosqich  enabled: true   — chegaralar amal qila boshlaydi
billing:
  enabled: false
  note: "Bepul davr — chegaralar qoʻllanmaydi. Toʻlovni yoqish: enabled: true"


# --------------------------------------------------------------------- #
# Rejalar
# --------------------------------------------------------------------- #
