# Baholash protokoli — ADR-001
benchmark:
  suite: bench-uz-legal-v0
  questions: 100
  judges: 2
  dimensions:
    uzbek_fluency:       {weight: 0.30, min_score: 3.0}   # min dan past → rad
    legal_terminology:   {weight: 0.25}
    context_reasoning:   {weight: 0.30}
    instruction_following: {weight: 0.15}
  decision_rules:
    - "uzbek_fluency < 3.0 → nomzod rad etiladi"
    - "umumiy farq < 0.3 → kichikroq model tanlanadi"
    - "cpt_required = (uzbek_fluency < 3.5)"

# Yordamchi modellar
auxiliary:
  embedding:
    id: BAAI/bge-m3
    dim: 1024
    max_length: 8192
    modes: [dense, sparse, colbert]
    size_gb: 1.2
  reranker:
    id: BAAI/bge-reranker-v2-m3
    size_gb: 0.6
  nli:
    id: null   # groundedness gate uchun; baza model fallback

