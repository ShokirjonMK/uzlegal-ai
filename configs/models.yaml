# Model katalogi
#
# Bu fayl — modellarni almashtirish uchun yagona joy.
#
#   Yangi model qo'shish → shu yerga yozuv qo'shing
#   Modelni almashtirish → `uzlegal models use <id>` yoki UI dan
#   Xizmatni to'xtatmasdan → UI da «Katalogni qayta o'qish»
#
# Kod o'zgartirish hech qachon shart emas.
#
# Maydonlar: src/uzlegal/types.py → ModelSpec

models:

  # ------------------------------------------------------------------ #
  # Stub — model yuklab olinmasdan turib tizimni sinash uchun
  # ------------------------------------------------------------------ #
  echo:
    display_name: "Echo (stub — modelsiz sinov)"
    backend: echo
    size_gb: 0.0
    context_length: 8192
    note: "Soxta javob qaytaradi. API, UI va orkestratsiyani sinash uchun."

  # ------------------------------------------------------------------ #
  # Faza 0 nomzodlari — ADR-001 da o'lchab tanlanadi
  # ------------------------------------------------------------------ #
  qwen3-14b:
    display_name: "Qwen3 14B (4-bit)"
    backend: mlx
    hf_id: mlx-community/Qwen3-14B-4bit
    local_path: models/qwen3-14b-4bit
    params: "14B"
    quant_bits: 4
    size_gb: 8.0
    context_length: 32768
    license: Apache-2.0
    default_temperature: 0.3
    strengths: [reasoning, tool_calling, structured_output]
    risks: [uzbek_moderate]
    disable_thinking: true

  gemma3-12b:
    display_name: "Gemma 3 12B IT (4-bit)"
    backend: mlx
    hf_id: mlx-community/gemma-3-12b-it-4bit
    local_path: models/gemma3-12b-4bit
    params: "12B"
    quant_bits: 4
    size_gb: 7.0
    context_length: 131072
    license: Gemma-ToU
    default_temperature: 0.3
    strengths: [multilingual_140, turkic_languages, long_context]
    risks: [reasoning_weaker, license_restrictions]

  qwen3-8b:
    display_name: "Qwen3 8B (4-bit)"
    backend: mlx
    hf_id: mlx-community/Qwen3-8B-4bit
    local_path: models/qwen3-8b-4bit
    params: "8B"
    quant_bits: 4
    size_gb: 4.5
    context_length: 32768
    license: Apache-2.0
    strengths: [fast, cheap_training, headroom]
    risks: [complex_legal_reasoning_weak]
    note: "Tez iteratsiya va hybrid profilidagi 'tez rejim' uchun"
    disable_thinking: true

  mistral-small-24b:
    display_name: "Mistral Small 3.2 24B (4-bit)"
    backend: mlx
    hf_id: mlx-community/Mistral-Small-3.2-24B-Instruct-2506-4bit
    local_path: models/mistral-small-24b-4bit
    params: "24B"
    quant_bits: 4
    size_gb: 13.5
    context_length: 131072
    license: Apache-2.0
    strengths: [general_quality]
    risks: [memory_tight, lora_training_constrained]

  # ------------------------------------------------------------------ #
  # OpenAI-mos serverlar — Ollama, vLLM, LM Studio
  #
  # Bu yozuvlar MLX BO'LMAGAN platformalar (Linux, Windows) uchun asosiy
  # yo'l. Model boshqa jarayonda turadi, shuning uchun `size_gb: 0.0` —
  # u bizning xotira byudjetimizni band qilmaydi va reestr uni hech
  # qachon "sig'maydi" deb belgilamaydi.
  #
  # `hf_id` — SERVERDAGI nom. Ollama da `gemma3:12b`, vLLM da to'liq
  # HuggingFace yo'li. `endpoint` ko'rsatilmasa UZLEGAL_OPENAI_ENDPOINT,
  # u ham bo'lmasa http://localhost:11434/v1 ishlatiladi.
  # ------------------------------------------------------------------ #

  # ADR-001 qayta ko'rilgandan keyingi TANLANGAN model (2026-08-20).
  #
  # MLX yozuvi (`qwen3-14b`) faqat Apple Silicon da ishlaydi. Windows va
  # Linux da ayni model Ollama orqali chaqiriladi — vaznlar bir xil,
  # faqat ishga tushirish yo'li boshqa. Ikkalasi bir xil litsenziyada
  # (Apache-2.0), ya'ni platformaga qarab huquqiy holat o'zgarmaydi.
  ollama-qwen3-14b:
    display_name: "Qwen3 14B (Ollama)"
    backend: openai
    hf_id: qwen3:14b
    params: "14B"
    quant_bits: 4
    size_gb: 0.0
    context_length: 40960
    license: Apache-2.0
    default_temperature: 0.3
    strengths: [multilingual, apache_license, long_context]
    note: "ADR-001 (qayta ko'rilgan) da tanlangan model. Litsenziya toza."
    disable_thinking: true

  # Tez tekshiruv uchun — sifat past, lekin quvurni sinash uchun yetarli.
  ollama-qwen3-8b:
    display_name: "Qwen3 8B (Ollama — tez)"
    backend: openai
    hf_id: qwen3:8b
    params: "8B"
    quant_bits: 4
    size_gb: 0.0
    context_length: 40960
    license: Apache-2.0
    default_temperature: 0.3
    strengths: [speed, apache_license]
    risks: [past_sifat]
    note: "Faqat quvurni sinash uchun. Sifat o'lchovlari bu modelda olinmaydi."
    disable_thinking: true

  # 8 GB VRAM uchun eng yaxshi variant (2026-08-21 da o'lchandi).
  #
  # NEGA MUHIM. `ollama-qwen3-14b` — e'lon qilingan ishlab chiqarish
  # modeli, lekin uning vaznlari 9.3 GB va 8 GB kartaga SIG'MAYDI:
  # xotira PCIe orqali tizimga to'kiladi va tezlik o'nlab barobar
  # tushadi (o'lchandi: GPU 93% yuklama, atigi 41 W quvvat).
  #
  # qwen3.5 esa 6.6 GB — to'liq kartaga sig'adi, yangiroq avlod va
  # litsenziyasi bir xil (Apache-2.0), ya'ni ADR-001 ning qayta
  # ko'rilgan qarori buzilmaydi.
  ollama-qwen35:
    display_name: "Qwen3.5 9.7B (Ollama)"
    backend: openai
    hf_id: qwen3.5:latest
    params: "9.7B"
    quant_bits: 4
    size_gb: 6.6
    context_length: 262144
    license: Apache-2.0
    default_temperature: 0.3
    strengths: [fits_8gb_vram, apache_license, long_context, multilingual]
    note: "8 GB kartada to'liq GPU da ishlaydi. 14B sig'maganda shu ishlatiladi."
    disable_thinking: true

  ollama-gemma3-12b:
    display_name: "Gemma 3 12B (Ollama)"
    backend: openai
    hf_id: gemma3:12b
    params: "12B"
    quant_bits: 4
    size_gb: 0.0
    context_length: 131072
    license: Gemma-ToU
    default_temperature: 0.3
    strengths: [multilingual_140, turkic_languages, long_context]
    note: "ADR-001 da tanlangan model. 8 GB VRAM da bir qismi CPU ga tushadi."

  ollama-gemma3-27b:
    display_name: "Gemma 3 27B (Ollama)"
    backend: openai
    hf_id: gemma3:27b
    params: "27B"
    quant_bits: 4
    size_gb: 0.0
    context_length: 131072
    license: Gemma-ToU
    default_temperature: 0.3
    strengths: [general_quality, long_context]
    risks: [slow_on_8gb_vram]
    note: "Sifat yuqoriroq, lekin 8 GB VRAM da sezilarli sekin."

  ollama-gemma3-4b:
    display_name: "Gemma 3 4B (Ollama — tez)"
    backend: openai
    hf_id: gemma3:4b
    params: "4B"
    quant_bits: 4
    size_gb: 0.0
    context_length: 131072
    license: Gemma-ToU
    default_temperature: 0.3
    strengths: [fast, fits_8gb_vram]
    risks: [complex_legal_reasoning_weak]
    note: "8 GB VRAM ga to'liq sig'adi — iteratsiya va smoke testlar uchun."

  # O'z GPU serveringiz (hybrid / server profili). Mijoz ma'lumoti
  # uchinchi tomonga chiqmasligi uchun faqat o'z endpointingiz.
  # remote-32b:
  #   display_name: "UzLegal 32B (o'z serveri)"
  #   backend: openai
  #   endpoint: https://gpu.example.uz/v1
  #   hf_id: Qwen/Qwen3-32B
  #   size_gb: 0.0
  #   context_length: 32768


# --------------------------------------------------------------------- #
# Rol adapterlari — Faza 4 da o'qitiladi (ADR-003)
# Baza model xotirada qoladi, faqat 40 MB lik adapter almashadi
# --------------------------------------------------------------------- #
adapters: {}
#  advocate:
#    path: adapters/advocate/current
#    base_model: qwen3-14b
#    rank: 16
#    size_mb: 40
#    metrics: {role_fidelity: 0.91, citation_coverage: 0.96}


# --------------------------------------------------------------------- #
# Yordamchi modellar (Faza 2 — RAG)
# --------------------------------------------------------------------- #
auxiliary:
  embedding:
    id: BAAI/bge-m3
    dim: 1024
    max_length: 8192
    size_gb: 1.2
  reranker:
    id: BAAI/bge-reranker-v2-m3
    size_gb: 0.6


# --------------------------------------------------------------------- #
# Faza 0 baholash protokoli — ADR-001
# --------------------------------------------------------------------- #
benchmark:
  suite: bench-uz-legal-v0
  questions: 100
  judges: 2
  dimensions:
    uzbek_fluency:         {weight: 0.30, min_score: 3.0}
    legal_terminology:     {weight: 0.25}
    context_reasoning:     {weight: 0.30}
    instruction_following: {weight: 0.15}
  decision_rules:
    - "uzbek_fluency < 3.0 → nomzod rad etiladi"
    - "umumiy farq < 0.3 → kichikroq model tanlanadi"
    - "cpt_required = (uzbek_fluency < 3.5)"

# Faza 0 baholashi natijasi (2026-08-11) — ADR-001
# gemma3-12b 3.77 · qwen3-14b 3.28 · qwen3-8b 3.22
# CPT shart emas: o'zbek tili 4.82/5
#
# LEKIN tanlov 2026-08-20 da O'ZGARTIRILDI — ADR-001 qayta ko'rildi.
# Ball emas, LITSENZIYA hal qildi: Gemma ToU tijoriy foydalanish va
# hosila modellarga cheklov qo'yadi, Qwen3 esa Apache-2.0.
# Iqtibosga asoslangan yuridik mahsulotda huquqiy tozalik 0.49 balldan
# muhimroq. Batafsil: docs/adr/ADR-001-base-model.md § «Qayta ko'rish».
selected: qwen3-14b
releases: []
