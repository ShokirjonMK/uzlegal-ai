  # ── Protsessual ─────────────────────────────────────────────────────
  #
  # Protsessual savol qaysi kodeksga tegishli ekani nizo turiga bog'liq:
  # jinoiy → JPK, fuqarolik → FPK, iqtisodiy → IPK, ma'muriy → MSIYK.
  # Shuning uchun protsessual triggerlar soha triggerlari bilan
  # **birga** ishlaydi: "sudga shikoyat" + "xodim" → mehnat + FPK.
  #
  # Har bir protsessual sohaning `documents` ro'yxatida **moddiy kodeks
  # ham** bor. Sabab baholashda o'lchangan: "Sudga murojaat qilish uchun
  # necha yil vaqt bor" savoli protsessual ko'rinadi, lekin javob
  # Fuqarolik kodeksidagi da'vo muddatida. Faqat FPK ni ko'tarish bu
  # savolni buzardi — ikkalasi ko'tarilsa, ikkala ehtimol ham saqlanadi.

  fuqarolik-protsessual:
    documents: [fuqarolik protsessual kodeksi, fuqarolik kodeksi]
