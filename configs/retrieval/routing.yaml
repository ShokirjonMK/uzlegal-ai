# Hujjat yo'naltirish — savolni to'g'ri kodeksga bog'lash
#
# ## Nima uchun kerak
#
# Indeksda 20 ta kodeks bor va ularning modda raqamlari **takrorlanadi**.
# Baholashda o'lchangan tipik nosozlik:
#
#   savol:   "Maoshni to'lash tartibi va muddatlari"
#   kerak:   Mehnat kodeksi, 333-modda
#   olindi:  Bojxona kodeksi 327 · Bojxona kodeksi 333
#
# Ikkala kodeksda ham "333-modda" bor va ikkalasida ham "to'lash",
# "muddat" so'zlari uchraydi. BM25 ular orasidagi farqni ko'rmaydi,
# chunki farq **so'zda emas, sohada**.
#
# ## Qanday ishlaydi
#
# Savoldagi soha belgilari sanaladi, eng ko'p ball olgan soha(lar)ning
# hujjatlari **ko'tariladi** (boost). Bu qat'iy filtr emas — noto'g'ri
# yo'naltirish recall ni buzmasligi uchun boshqa hujjatlar ro'yxatda
# qoladi, faqat pastroq o'rinda.
#
# ## Format
#
#   triggers  — savolda uchrasa shu sohaga ball qo'shadigan so'zlar.
#               `fold()` qilingan shaklda taqqoslanadi (apostrof, kirill).
#   documents — hujjat sarlavhasida qidiriladigan bo'lak (folded).
#   weight    — sohaning boost kuchi (standart 1.0).
#
# Yangi kodeks qo'shilsa — shu yerga yozuv qo'shiladi, kod o'zgarmaydi.

# Bir soha belgisining bazaviy og'irligi. Ko'p so'zli iboralar aniqroq,
# shuning uchun ular avtomatik ko'proq ball oladi (so'zlar soniga qarab).
term_weight: 1.0
phrase_bonus: 0.5

# Fusiondan keyingi ballga qo'llaniladigan ko'paytma:
#   yakuniy_ball = ball × (1 + boost × soha_ishonchi)
boost: 0.8

# Eng yuqori soha bali shu qiymatdan past bo'lsa — yo'naltirish
# qo'llanilmaydi (savol umumiy, taxmin qilishning ma'nosi yo'q).
min_score: 1.0

