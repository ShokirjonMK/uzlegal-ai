[project]
name = "uzlegal"
version = "0.1.0"
description = "O'zbekiston huquqiy tizimi uchun ko'p-agentli, iqtibosga asoslangan AI platformasi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shokirjon Madaminov", email = "mkshokirjon@gmail.com"}]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Apple Silicon — MLX runtime
mac = [
    "mlx>=0.21",
    "mlx-lm>=0.20",
]
# Linux + CUDA — vLLM runtime
cuda = [
    "vllm>=0.6",
]
# RAG qatlami (Faza 2)
rag = [
    "lancedb>=0.17",
    "sentence-transformers>=3.3",
    "FlagEmbedding>=1.3",
    "rank-bm25>=0.2",
]
# Orkestratsiya (Faza 5)
agents = [
    "langgraph>=0.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[project.scripts]
uzlegal = "uzlegal.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzlegal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # Loyiha matnlari o'zbek tilida. RUF001–003 "noaniq belgi" deb
    # o'zbek apostrofini (oʻ, gʻ) va tire (—, –) ni belgilaydi — bular
    # bu yerda xato emas, to'g'ri imlo.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Typer ning standart uslubi — parametr standartida `typer.Option(...)`.
# B008 bu yerda noto'g'ri ogohlantirish.
"src/uzlegal/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Qatlam bog'liqliklari — docs/12-repo-structure.md § 2
[tool.importlinter]
root_package = "uzlegal"

[[tool.importlinter.contracts]]
name = "Interfeys qatlami yadroga bog'liq, aksincha emas"
type = "layers"
layers = [
    # CLI boshqa interfeyslardan yuqorida: u ularni **ishga tushiradi**
    # (`uzlegal serve`, `uzlegal bot`, `uzlegal mcp`). Bir qatlamga
    # qo'yilsa bu import taqiqlanardi, holbuki u to'g'ri yo'nalish.
    "uzlegal.cli",
    "uzlegal.api | uzlegal.mcp | uzlegal.bot | uzlegal.sdk",
    "uzlegal.core",
    "uzlegal.orchestrator",
    "uzlegal.agents",
    "uzlegal.inference | uzlegal.retrieval",
    "uzlegal.index",
    "uzlegal.ingest",
]
