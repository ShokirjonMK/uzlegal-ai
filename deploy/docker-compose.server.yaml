# UzLegal-AI — server profili (docs/15 § 4.4)
#
# Ishga tushirish:
#   cp .env.example .env    # to'ldiring
#   docker compose -f deploy/docker-compose.server.yaml up -d
#
# Diqqat: `vllm` birinchi ishga tushishda modelni yuklab oladi (32B uchun
# ~65 GB). Shuning uchun `start_period` uzun va boshqa xizmatlar uning
# sog'ligini kutadi — aks holda ular modelsiz API ga so'rov yuborardi.

name: uzlegal

services:
  # ── LLM ─────────────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ../adapters:/adapters:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ATTENTION_BACKEND: FLASHINFER
    # `--enable-lora` + `--max-loras 5` — beshta rol adapteri bir vaqtda
    # xizmat qilinadi. Aynan shu server profilining asosiy afzalligi
    # (docs/06 § 5): Mac da adapterlar ketma-ket almashadi, bu yerda esa
    # debate haqiqatan parallel bo'ladi.
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct}
      --dtype bfloat16
      --max-model-len 32768
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --enable-lora
      --max-loras 5
      --max-lora-rank 16
      --enable-prefix-caching
      --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  # ── Embedding (BGE-M3) ──────────────────────────────────────────────
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    volumes:
      - hf-cache:/data
    command: --model-id BAAI/bge-m3 --port 8002
    ports:
      - "8002:8002"

  # ── Reranker ────────────────────────────────────────────────────────
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    volumes:
      - hf-cache:/data
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8001
    ports:
      - "8001:8001"

  # ── Vektor bazasi ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  # ── Leksik qidiruv ──────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx2g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  # ── Audit va holat ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uzlegal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da ko'rsatilishi shart}
      POSTGRES_DB: uzlegal
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzlegal"]
      interval: 10s
      retries: 5

  # ── Asosiy API ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      UZLEGAL_PROFILE: server
      UZLEGAL_API_HOST: 0.0.0.0
      # vLLM shu tarmoqda OpenAI-mos server sifatida turadi. `openai`
      # backend aynan shu manzilga murojaat qiladi (configs/profiles/server.yaml).
      UZLEGAL_OPENAI_ENDPOINT: http://vllm:8000/v1
      # `:?` — sozlanmagan bo'lsa compose ISHGA TUSHMAYDI. Ataylab:
      # ishlab chiqarishda `/v1/admin/*` himoyasiz qolgandan ko'ra
      # xizmat ko'tarilmagani yaxshiroq. Kalit yaratish:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      UZLEGAL_ADMIN_KEY: ${UZLEGAL_ADMIN_KEY:?admin kaliti shart — /v1/admin/* himoyasi}
      UZLEGAL_API_KEYS: ${UZLEGAL_API_KEYS:-}
      UZLEGAL_TELEGRAM_BOT_TOKEN: ${UZLEGAL_TELEGRAM_BOT_TOKEN:-}
      UZLEGAL_TELEGRAM_CHAT_ID: ${UZLEGAL_TELEGRAM_CHAT_ID:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://uzlegal@postgres:5432/uzlegal}
    volumes:
      - ../kb:/app/kb:ro
    depends_on:
      vllm: {condition: service_healthy}
      qdrant: {condition: service_started}
      elasticsearch: {condition: service_started}
      postgres: {condition: service_healthy}
    ports:
      - "8080:8080"

  # ── Telegram bot ────────────────────────────────────────────────────
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      UZLEGAL_PROFILE: server
      UZLEGAL_OPENAI_ENDPOINT: http://vllm:8000/v1
      UZLEGAL_TELEGRAM_BOT_TOKEN: ${UZLEGAL_TELEGRAM_BOT_TOKEN:?bot uchun token shart}
      UZLEGAL_TELEGRAM_CHAT_ID: ${UZLEGAL_TELEGRAM_CHAT_ID:-}
      UZLEGAL_TELEGRAM_ALLOWED_CHATS: ${UZLEGAL_TELEGRAM_ALLOWED_CHATS:-}
    volumes:
      - ../kb:/app/kb:ro
    depends_on:
      api: {condition: service_started}
    command: ["uzlegal", "bot"]

  # ── MCP server (stdio) ──────────────────────────────────────────────
  #
  # MCP stdio ustida ishlaydi, port ochmaydi. Konteyner sifatida u
  # `docker compose run --rm mcp` orqali chaqiriladi; doimiy xizmat emas.
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: [tools]
    environment:
      UZLEGAL_PROFILE: server
    volumes:
      - ../kb:/app/kb:ro
    command: ["uzlegal", "mcp"]

  # ── Kuzatiluvchanlik ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    restart: unless-stopped
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "9090:9090"   # Prometheus

volumes:
  hf-cache:
  qdrant-data:
  es-data:
  pg-data:
